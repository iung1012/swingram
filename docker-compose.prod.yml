services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      PORT: "5005"
      API_BASE_URL: "/"
    volumes:
      - ./backend_data/storage:/app/backend_data/storage
    networks:
      - default
      - postgres17_default
    restart: unless-stopped

  frontend:
    build:
      context: .
      target: runner
      args:
        VITE_API_BASE_URL: /
    depends_on:
      - backend
    environment:
      PORT: "3000"
      API_BASE_URL: "http://backend:5005"
    networks:
      - default
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - frontend
      - backend
    expose:
      - "80"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`swingram.cc`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls=true"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.frontend.service=frontend"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - default
    restart: unless-stopped

networks:
  postgres17_default:
    external: true
