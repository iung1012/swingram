services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      PORT: "5005"
      API_BASE_URL: "/"
    volumes:
      - ./backend_data/storage:/app/backend_data/storage
    networks:
      - default
      - postgres17_default
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /
    depends_on:
      - backend
    expose:
      - "80"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.brasa.rule=Host(`swingram.cc`)"
      - "traefik.http.routers.brasa.entrypoints=websecure"
      - "traefik.http.routers.brasa.tls=true"
      - "traefik.http.routers.brasa.tls.certresolver=letsencrypt"
      - "traefik.http.routers.brasa.service=brasa-web"
      - "traefik.http.services.brasa-web.loadbalancer.server.port=80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - default
    restart: unless-stopped

networks:
  postgres17_default:
    external: true
